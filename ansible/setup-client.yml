- name: Setup wacli notifier
  hosts: localhost
  connection: local
  vars:
    wacli_dir: "{{ ansible_env.HOME }}/proj/wacli"

  tasks:
    - name: Create systemd user directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Install wacli-notifier service
      ansible.builtin.template:
        src: wacli-notifier.service.j2
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/wacli-notifier.service"
        mode: "0644"

    - name: Reload systemd user daemon
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user

    - name: Enable and start wacli-notifier
      ansible.builtin.systemd:
        name: wacli-notifier
        enabled: true
        state: started
        scope: user
