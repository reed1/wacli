- name: Deploy wacli server
  hosts: prod_servers
  vars:
    ansible_become_pass: "{{ lookup('pipe', 'rpass get personal/hosts/sgtent/ssh') }}"
  tasks:
    - name: Deploy .env file
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_dir }}/server/.env"
        mode: "0600"
      tags: [push-server]

    - name: Deploy transcribe script
      ansible.builtin.template:
        src: templates/transcribe.sh.j2
        dest: "{{ app_dir }}/server/transcribe.sh"
        mode: "0755"
      tags: [push-server]

    - name: Build Go binary
      ansible.builtin.command:
        cmd: go build
        chdir: "{{ app_dir }}/server"
      tags: [push-server]

    - name: Enable user lingering
      become: true
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ ansible_user }}

    - name: Create systemd user directory
      ansible.builtin.file:
        path: "{{ home_dir }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Install wacli-server service
      ansible.builtin.template:
        src: templates/wacli-server.service.j2
        dest: "{{ home_dir }}/.config/systemd/user/wacli-server.service"
        mode: "0644"

    - name: Reload systemd user daemon
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      tags: [push-server]

    - name: Restart wacli-server
      ansible.builtin.systemd:
        name: wacli-server
        enabled: true
        state: restarted
        scope: user
      tags: [never, push-server]
