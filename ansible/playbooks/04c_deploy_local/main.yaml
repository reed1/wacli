- name: Deploy wacli notifier
  hosts: local
  tasks:
    - name: Create systemd user directory
      ansible.builtin.file:
        path: "{{ home_dir }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Install wacli-notifier service
      ansible.builtin.template:
        src: templates/wacli-notifier.service.j2
        dest: "{{ home_dir }}/.config/systemd/user/wacli-notifier.service"
        mode: "0644"
      tags: [push-local]

    - name: Reload systemd user daemon
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      tags: [push-local]

    - name: Enable and restart wacli-notifier
      ansible.builtin.systemd:
        name: wacli-notifier
        enabled: true
        state: restarted
        scope: user
      tags: [never, push-local]
